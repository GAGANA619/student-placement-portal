# ==========================================
# AUTOMATED STUDENT PLACEMENT PORTAL
# Kubernetes Deployment + Service
# ==========================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-placement-portal

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: student-placement-portal

  template:
    metadata:
      labels:
        app: student-placement-portal

    spec:
      containers:
        - name: student-placement-portal
          image: student-placement-portal:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

---
# ==========================================
# SERVICE
# ==========================================

apiVersion: v1
kind: Service

metadata:
  name: student-placement-portal-service

spec:
  type: NodePort

  selector:
    app: student-placement-portal

  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP